<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Mete 3D Studio - Ürün Kataloğu</title>

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mete 3D Katalog">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #0ea5e9; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <header class="sticky top-0 z-30 bg-slate-900 text-white shadow-lg pb-safe">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-sky-500 rounded-lg flex items-center justify-center shadow-lg shadow-sky-500/30">
                    <i class="ph-bold ph-cube text-2xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">Mete 3D Studio</h1>
                    <p class="text-[11px] text-slate-400 font-semibold uppercase tracking-wider">Katalog & Maliyet Motoru</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="openSettingsModal()" class="bg-slate-800 hover:bg-slate-700 text-white p-2.5 rounded-lg transition-colors shadow-md border border-slate-700" title="Ayarlar">
                    <i class="ph-bold ph-gear text-lg"></i>
                </button>
                <button onclick="openModal()" class="bg-sky-500 hover:bg-sky-400 text-white px-4 py-2.5 rounded-lg text-sm font-bold flex items-center gap-2 transition-colors shadow-md">
                    <i class="ph-bold ph-plus text-lg"></i> <span class="hidden sm:inline">Yeni Ürün</span>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl mx-auto w-full px-4 py-8">
        <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mb-8">
            <h2 class="text-2xl font-bold text-slate-800">Katalog</h2>
            <div class="w-full sm:w-auto relative">
                <i class="ph-regular ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="searchInput" oninput="filterProducts()" placeholder="Ürün ara..." class="w-full sm:w-64 pl-10 pr-4 py-2 bg-white border border-slate-200 rounded-xl shadow-sm focus:outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-200 transition-all text-sm">
            </div>
        </div>

        <div id="loading" class="flex flex-col items-center justify-center py-20">
            <div class="loader mb-4"></div>
            <p class="text-slate-500 font-medium animate-pulse" id="loadingText">Veritabanına bağlanılıyor...</p>
        </div>

        <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 hidden"></div>
        
        <div id="emptyState" class="hidden flex-col items-center justify-center py-20 text-center">
            <i class="ph-duotone ph-package text-6xl text-slate-300 mb-4"></i>
            <h3 class="text-lg font-bold text-slate-700">Henüz ürün yok</h3>
            <p class="text-sm text-slate-500 mt-2">Sağ üstteki butondan ilk ürününüzü ekleyin.</p>
        </div>
    </main>

    <!-- MODAL: AYARLAR -->
    <div id="settingsModal" class="fixed inset-0 bg-slate-900/60 hidden items-center justify-center z-[60] p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden">
            <div class="px-5 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h3 class="font-bold text-lg text-slate-800 flex items-center gap-2">
                    <i class="ph-fill ph-gear text-slate-500 text-xl"></i> Maliyet Ayarları
                </h3>
                <button onclick="closeSettingsModal()" class="text-slate-400 hover:text-rose-500 transition-colors"><i class="ph-bold ph-x text-xl"></i></button>
            </div>
            <div class="p-5 space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Filament Kilo Fiyatı (1 KG / ₺)</label>
                    <input type="number" id="s_fil_kg" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:border-sky-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Saatlik Baskı Ücreti (₺)</label>
                    <input type="number" id="s_hour_rate" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:border-sky-500 outline-none">
                </div>
            </div>
            <div class="px-5 py-4 border-t border-slate-100 bg-slate-50 flex justify-end gap-3">
                <button onclick="closeSettingsModal()" class="px-4 py-2 rounded-lg font-bold text-sm text-slate-600 hover:bg-slate-200">İptal</button>
                <button id="saveSetBtn" onclick="saveSettings()" class="bg-slate-800 hover:bg-slate-700 text-white px-5 py-2 rounded-lg font-bold text-sm">Kaydet & Güncelle</button>
            </div>
        </div>
    </div>

    <!-- MODAL: ÜRÜN EKLE / DÜZENLE -->
    <div id="productModal" class="fixed inset-0 bg-slate-900/60 hidden items-center justify-center z-50 p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h3 id="modalTitle" class="font-bold text-lg text-slate-800 flex items-center gap-2">
                    <i class="ph-fill ph-plus-circle text-sky-500 text-xl"></i> Ürün Ekle
                </h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-rose-500 transition-colors"><i class="ph-bold ph-x text-xl"></i></button>
            </div>
            
            <div class="p-6 overflow-y-auto flex-1">
                <form id="productForm" class="space-y-5">
                    <input type="hidden" id="p_id"> 
                    <input type="hidden" id="p_existing_img"> <!-- Eski görsel linkini tutar -->

                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Ürün Fotoğrafı</label>
                        <div class="flex items-center justify-center w-full">
                            <label class="flex flex-col items-center justify-center w-full h-40 border-2 border-slate-300 border-dashed rounded-xl cursor-pointer bg-slate-50 hover:bg-slate-100 transition-colors relative overflow-hidden">
                                <div class="flex flex-col items-center justify-center pt-5 pb-6" id="uploadPlaceholder">
                                    <i class="ph-regular ph-upload-simple text-3xl text-slate-400 mb-2"></i>
                                    <p class="text-sm text-slate-500 font-medium text-center px-4">Fotoğraf seçmek için dokunun (Hızlı Yükleme)</p>
                                </div>
                                <img id="imagePreview" class="hidden absolute inset-0 w-full h-full object-cover">
                                <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="previewImage(this)" />
                            </label>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-600 mb-1">Ürün Adı</label>
                            <input type="text" id="p_name" required class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:border-sky-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 mb-1">Kategori</label>
                            <select id="p_category" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:border-sky-500 outline-none bg-white">
                                <option>Figür / Model</option>
                                <option>Aksesuar</option>
                                <option>Dekorasyon</option>
                                <option>Fonksiyonel Parça</option>
                                <option>Diğer</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">Genel Açıklama / Not</label>
                        <textarea id="p_desc" rows="2" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:border-sky-500 outline-none"></textarea>
                    </div>

                    <div class="bg-indigo-50 p-4 rounded-xl border border-indigo-100">
                        <div class="text-sm font-bold text-indigo-900 mb-3 flex justify-between items-center">
                            <span><i class="ph-fill ph-printer"></i> Üretim Verileri</span>
                        </div>
                        <div class="grid grid-cols-3 gap-3">
                            <div>
                                <label class="block text-[10px] uppercase font-bold text-indigo-700 mb-1">Filament (Gr)</label>
                                <input type="number" id="p_gram" oninput="autoCalculate()" class="w-full border border-indigo-200 rounded-lg p-2 text-sm outline-none font-bold">
                            </div>
                            <div>
                                <label class="block text-[10px] uppercase font-bold text-indigo-700 mb-1">Süre (Dakika)</label>
                                <input type="number" id="p_time" oninput="autoCalculate()" class="w-full border border-indigo-200 rounded-lg p-2 text-sm outline-none font-bold">
                            </div>
                            <div>
                                <label class="block text-[10px] uppercase font-bold text-indigo-700 mb-1">Ek Aksesuar (₺)</label>
                                <input type="number" id="p_acc" oninput="autoCalculate()" class="w-full border border-indigo-200 rounded-lg p-2 text-sm outline-none font-bold">
                            </div>
                        </div>
                    </div>

                    <div class="bg-sky-50 p-4 rounded-xl border border-sky-100 space-y-4">
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-[10px] uppercase font-bold text-slate-500 mb-1">Hesaplanan Maliyet (₺)</label>
                                <div class="w-full bg-slate-200/50 border border-slate-300 rounded-lg p-2.5 text-lg font-bold text-slate-700 text-center" id="p_cost_display">0.00 ₺</div>
                                <input type="hidden" id="p_cost_hidden" value="0">
                            </div>
                            <div>
                                <label class="block text-[10px] uppercase font-bold text-sky-600 mb-1">Hedef Kâr Marjı (%)</label>
                                <input type="number" id="p_margin" value="40" min="0" oninput="autoCalculate()" class="w-full border-2 border-sky-300 bg-white rounded-lg p-2.5 text-lg font-bold text-sky-800 text-center outline-none">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Önerilen Satış Fiyatı (₺)</label>
                            <input type="number" id="p_price" step="0.01" min="0" required class="w-full border-2 border-emerald-400 bg-white rounded-lg p-3 text-xl font-black text-emerald-700 text-center outline-none shadow-sm focus:border-emerald-500">
                        </div>
                    </div>
                </form>
            </div>
            
            <div class="px-6 py-4 border-t border-slate-100 bg-slate-50 flex justify-end gap-3">
                <button onclick="closeModal()" class="px-5 py-2.5 rounded-lg font-bold text-sm text-slate-600 hover:bg-slate-200 transition">İptal</button>
                <button id="saveBtn" onclick="saveProduct()" class="bg-emerald-500 hover:bg-emerald-600 text-white px-6 py-2.5 rounded-lg font-bold text-sm shadow-md transition flex items-center gap-2">
                    <i class="ph-bold ph-check"></i> Kaydet
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- BURAYI DOLDURUN ---
        const API_URL = "https://script.google.com/macros/s/AKfycbxX7lQS3ibOOQMmX_rj9H2lmvy0l9SdR-G-2lt6ioKvbTZsf0gObfj0AZ52xsWVy5fDKA/exec";
        const IMGBB_API_KEY = "b9a0c312e1e3d3a4ebefa2ddd5602a2c"; // <-- ImgBB'den aldığınız şifreyi buraya yapıştırın!
        
        let products = [];
        let selectedImageFile = null;

        let settings = JSON.parse(localStorage.getItem('mete3d_settings')) || { filKgPrice: 400, hourlyRate: 20 };

        window.onload = () => {
            fetchProducts();
            document.getElementById('s_fil_kg').value = settings.filKgPrice;
            document.getElementById('s_hour_rate').value = settings.hourlyRate;
        };

        function openSettingsModal() { document.getElementById('settingsModal').classList.replace('hidden', 'flex'); }
        function closeSettingsModal() { document.getElementById('settingsModal').classList.replace('flex', 'hidden'); }
        
        async function saveSettings() {
            settings.filKgPrice = parseFloat(document.getElementById('s_fil_kg').value) || 0;
            settings.hourlyRate = parseFloat(document.getElementById('s_hour_rate').value) || 0;
            localStorage.setItem('mete3d_settings', JSON.stringify(settings));
            
            const btn = document.getElementById('saveSetBtn');
            btn.innerHTML = 'Revize Ediliyor...'; btn.disabled = true;

            let updates = [];
            products.forEach(p => {
                const gram = parseFloat(p.Gram) || 0; const dk = parseFloat(p.Dakika) || 0; const acc = parseFloat(p["Ek Aksesuar"]) || 0;
                const oldCost = parseFloat(p.Maliyet) || 0; const oldPrice = parseFloat(p["Satis Fiyati"]) || 0;
                const newCost = ((gram / 1000) * settings.filKgPrice) + ((dk / 60) * settings.hourlyRate) + acc;
                if((gram > 0 || dk > 0) && Math.abs(newCost - oldCost) > 0.01) {
                    let margin = 0.40;
                    if(oldPrice > oldCost && oldPrice > 0) margin = (oldPrice - oldCost) / oldPrice;
                    updates.push({ ID: p.ID, Maliyet: newCost, SatisFiyati: Math.ceil(newCost / (1 - margin)) });
                }
            });

            if(updates.length > 0) {
                document.getElementById('loadingText').innerText = "Fiyatlar revize ediliyor...";
                document.getElementById('loading').classList.remove('hidden'); document.getElementById('productsGrid').classList.add('hidden');
                try { await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'bulkUpdate', updates: updates }) }); } catch(e) {}
            }
            btn.innerHTML = 'Kaydet & Güncelle'; btn.disabled = false; closeSettingsModal(); fetchProducts();
        }

        async function fetchProducts() {
            document.getElementById('loadingText').innerText = "Veritabanına bağlanılıyor...";
            document.getElementById('loading').classList.remove('hidden');
            try {
                const response = await fetch(API_URL);
                products = await response.json();
                document.getElementById('loading').classList.add('hidden');
                
                if(!products || products.length === 0) {
                    document.getElementById('emptyState').classList.replace('hidden', 'flex');
                    document.getElementById('productsGrid').classList.add('hidden');
                } else {
                    document.getElementById('emptyState').classList.replace('flex', 'hidden');
                    document.getElementById('productsGrid').classList.remove('hidden');
                    renderProducts(products);
                }
            } catch (error) { alert("Veriler çekilirken bir hata oluştu."); }
        }

        function renderProducts(dataList) {
            const grid = document.getElementById('productsGrid'); grid.innerHTML = '';
            dataList.forEach(p => {
                let imgUrl = (p["Fotograf URL"] && p["Fotograf URL"].trim() !== "") ? p["Fotograf URL"] : 'https://placehold.co/400x300/e2e8f0/94a3b8?text=Gorsel+Yok';
                
                // Eğer eski sistemden kalan Google Drive linkleri varsa onları gösterilebilir formata çevir
                if (imgUrl.includes('drive.google.com/file/d/')) {
                    const match = imgUrl.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
                    if (match && match[1]) imgUrl = `https://drive.google.com/uc?export=view&id=${match[1]}`;
                }

                const cost = isNaN(parseFloat(p.Maliyet)) ? 0 : parseFloat(p.Maliyet);
                const price = isNaN(parseFloat(p["Satis Fiyati"])) ? 0 : parseFloat(p["Satis Fiyati"]);
                let profitRate = (price > 0 && price > cost) ? ((price - cost) / price) * 100 : 0;
                
                const techDetails = [parseFloat(p.Gram)>0 ? `${p.Gram} gr` : '', parseFloat(p.Dakika)>0 ? `${p.Dakika} dk` : ''].filter(Boolean).join(' | ');
                const safeP = encodeURIComponent(JSON.stringify(p));

                const card = `
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden hover:shadow-lg transition-shadow duration-300 flex flex-col relative">
                    <div class="absolute top-2 right-2 flex gap-1 z-10">
                        <button onclick="editProduct('${safeP}')" class="bg-white/90 hover:bg-sky-500 hover:text-white text-slate-700 p-2 rounded-lg backdrop-blur shadow-sm"><i class="ph-bold ph-pencil-simple"></i></button>
                        <button onclick="deleteProduct('${p.ID}')" class="bg-white/90 hover:bg-rose-500 hover:text-white text-rose-500 p-2 rounded-lg backdrop-blur shadow-sm"><i class="ph-bold ph-trash"></i></button>
                    </div>
                    <div class="h-48 overflow-hidden bg-slate-100 relative group cursor-pointer" onclick="window.open('${imgUrl}', '_blank')">
                        <img src="${imgUrl}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                        <span class="absolute top-3 left-3 bg-slate-900/70 text-white backdrop-blur text-[10px] font-bold px-2 py-1 rounded-md">${p.Kategori || 'Genel'}</span>
                    </div>
                    <div class="p-4 flex-1 flex flex-col">
                        <h3 class="font-bold text-lg text-slate-800 leading-tight mb-1">${p["Urun Adi"] || 'İsimsiz Ürün'}</h3>
                        ${techDetails ? `<p class="text-[10px] font-bold text-indigo-600 mb-1">${techDetails}</p>` : ''}
                        <p class="text-[11px] text-slate-500 mb-4 whitespace-pre-wrap">${p.Aciklama || ''}</p>
                        
                        <div class="mt-auto pt-3 border-t border-slate-100 space-y-2">
                            <div class="flex justify-between text-xs">
                                <span class="text-slate-500 font-medium">Maliyet:</span>
                                <span class="font-bold text-slate-700">${cost.toFixed(2)} ₺</span>
                            </div>
                            <div class="flex justify-between items-center pt-1">
                                <span class="text-[10px] font-bold text-emerald-600 bg-emerald-50 px-2 py-1 rounded-md border border-emerald-100">%${profitRate.toFixed(0)} Brüt Kâr</span>
                                <span class="text-xl font-black text-slate-900">${price.toFixed(2)} ₺</span>
                            </div>
                        </div>
                    </div>
                </div>`;
                grid.innerHTML += card;
            });
        }

        function filterProducts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = products.filter(p => (p["Urun Adi"] || '').toLowerCase().includes(query) || (p.Kategori || '').toLowerCase().includes(query));
            renderProducts(filtered);
        }

        function openModal() {
            document.getElementById('productForm').reset();
            document.getElementById('modalTitle').innerHTML = '<i class="ph-fill ph-plus-circle text-sky-500 text-xl"></i> Ürün Ekle';
            document.getElementById('p_id').value = ""; document.getElementById('p_existing_img').value = "";
            document.getElementById('imagePreview').src = ''; document.getElementById('imagePreview').classList.add('hidden');
            document.getElementById('uploadPlaceholder').classList.remove('hidden');
            document.getElementById('p_cost_display').innerText = '0.00 ₺'; document.getElementById('p_cost_hidden').value = 0;
            selectedImageFile = null;
            document.getElementById('productModal').classList.replace('hidden', 'flex');
        }

        function editProduct(encodedProduct) {
            const p = JSON.parse(decodeURIComponent(encodedProduct));
            document.getElementById('modalTitle').innerHTML = '<i class="ph-fill ph-pencil-simple text-blue-500 text-xl"></i> Ürün Düzenle';
            document.getElementById('p_id').value = p.ID;
            document.getElementById('p_name').value = p["Urun Adi"] || ''; document.getElementById('p_category').value = p.Kategori || 'Figür / Model';
            document.getElementById('p_desc').value = p.Aciklama || ''; document.getElementById('p_gram').value = p.Gram || '';
            document.getElementById('p_time').value = p.Dakika || ''; document.getElementById('p_acc').value = p["Ek Aksesuar"] || '';
            
            let imgUrl = (p["Fotograf URL"] && p["Fotograf URL"].trim() !== "") ? p["Fotograf URL"] : '';
            if (imgUrl.includes('drive.google.com/file/d/')) {
                const match = imgUrl.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
                if (match && match[1]) imgUrl = `https://drive.google.com/uc?export=view&id=${match[1]}`;
            }
            document.getElementById('p_existing_img').value = imgUrl; // Sakla
            
            if(imgUrl) {
                document.getElementById('uploadPlaceholder').classList.add('hidden');
                document.getElementById('imagePreview').src = imgUrl; document.getElementById('imagePreview').classList.remove('hidden');
            } else {
                document.getElementById('uploadPlaceholder').classList.remove('hidden'); document.getElementById('imagePreview').classList.add('hidden');
            }
            selectedImageFile = null; autoCalculate(); 
            document.getElementById('p_price').value = p["Satis Fiyati"] || 0; 
            document.getElementById('productModal').classList.replace('hidden', 'flex');
        }

        async function deleteProduct(id) {
            if(!confirm("Bu ürünü silmek istediğinize emin misiniz?")) return;
            document.getElementById('loadingText').innerText = "Ürün siliniyor...";
            document.getElementById('loading').classList.remove('hidden'); document.getElementById('productsGrid').classList.add('hidden');
            try { await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'delete', ID: id }) }); fetchProducts(); } catch(e) {}
        }

        function closeModal() { document.getElementById('productModal').classList.replace('flex', 'hidden'); }

        function previewImage(input) {
            if (input.files && input.files[0]) {
                selectedImageFile = input.files[0];
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('uploadPlaceholder').classList.add('hidden');
                    document.getElementById('imagePreview').src = e.target.result;
                    document.getElementById('imagePreview').classList.remove('hidden');
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function autoCalculate() {
            const gram = parseFloat(document.getElementById('p_gram').value) || 0; const time = parseFloat(document.getElementById('p_time').value) || 0;
            const acc = parseFloat(document.getElementById('p_acc').value) || 0; const margin = parseFloat(document.getElementById('p_margin').value) || 40;
            const totalCost = ((gram / 1000) * settings.filKgPrice) + ((time / 60) * settings.hourlyRate) + acc;
            document.getElementById('p_cost_display').innerText = totalCost.toFixed(2) + ' ₺';
            document.getElementById('p_cost_hidden').value = totalCost;
            if(totalCost > 0) document.getElementById('p_price').value = Math.ceil(totalCost / (1 - (margin / 100)));
            else document.getElementById('p_price').value = '';
        }

        // FOTOĞRAFI IMGBB'YE YÜKLEME FONKSİYONU
        async function uploadToImgBB(file) {
            const formData = new FormData();
            formData.append('image', file);
            try {
                const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: 'POST', body: formData });
                const data = await res.json();
                if (data.success) return data.data.url; // Başarılıysa linki ver
            } catch (error) { console.error("Resim yükleme hatası", error); }
            return null;
        }

        async function saveProduct() {
            const id = document.getElementById('p_id').value; 
            const name = document.getElementById('p_name').value;
            const cost = document.getElementById('p_cost_hidden').value;
            const price = document.getElementById('p_price').value;

            if(!name || parseFloat(cost) <= 0 || !price) { alert("Lütfen Ürün Adını, üretim verilerini ve fiyatı doldurun."); return; }

            const btn = document.getElementById('saveBtn'); const originalBtnHtml = btn.innerHTML;
            btn.innerHTML = '<i class="ph-bold ph-spinner-gap animate-spin"></i> Hızlı Kaydediliyor...'; btn.disabled = true;

            // 1. ÖNCE FOTOĞRAFI IMGBB'YE YÜKLE (Veya Eskisini Koru)
            let finalImageUrl = document.getElementById('p_existing_img').value; 
            if(selectedImageFile) {
                btn.innerHTML = '<i class="ph-bold ph-spinner-gap animate-spin"></i> Fotoğraf Yükleniyor...';
                const uploadedUrl = await uploadToImgBB(selectedImageFile);
                if(uploadedUrl) finalImageUrl = uploadedUrl;
                else { alert("Fotoğraf yüklenemedi, işleminiz resimsiz devam edecek."); finalImageUrl = ""; }
            }

            // 2. SADECE METİN OLARAK GOOGLE SHEETS'E GÖNDER (1 Saniye sürer)
            const payload = {
                action: id ? 'update' : 'create', 
                ID: id,
                UrunAdi: name,
                Kategori: document.getElementById('p_category').value,
                Aciklama: document.getElementById('p_desc').value,
                Maliyet: cost,
                SatisFiyati: price,
                Gram: document.getElementById('p_gram').value || 0,
                Dakika: document.getElementById('p_time').value || 0,
                EkAksesuar: document.getElementById('p_acc').value || 0,
                FotografURL: finalImageUrl // Doğrudan link gönderilir
            };

            try {
                const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
                const result = await res.json();
                if(result.status === "success") { closeModal(); fetchProducts(); } 
                else alert("Kayıt sırasında hata: " + result.message);
            } catch(e) { alert("Bağlantı hatası yaşandı."); } 
            finally { btn.innerHTML = originalBtnHtml; btn.disabled = false; }
        }
    </script>
</body>
</html>
